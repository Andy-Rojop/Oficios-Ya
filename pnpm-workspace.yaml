packages:
  - 'Backend'
  - 'Frontend'
  - 'packages/*'
allowBuilds:
  '@firebase/util': true
  '@parcel/watcher': false
  '@prisma/engines': true
  '@scarf/scarf': false
  bcrypt: true
  esbuild: true
  prisma: true
  protobufjs: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@nestjs/common@12.1.2'
  - '@nestjs/core@12.1.2'
  - '@nestjs/platform-express@12.1.2'
  - '@nestjs/testing@12.1.2'
  - '@next/env@16.3.8'
  - '@next/eslint-plugin-next@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - eslint-config-next@16.3.8
  - next@16.3.8
  - create-next-app@16.3.8
