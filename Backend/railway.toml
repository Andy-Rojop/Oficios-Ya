# Config del servicio API en Railway.
# En el dashboard: Settings → Config-as-code path = /Backend/railway.toml
# (o pegá los mismos comandos en Settings → Build / Deploy).

[build]
builder = "RAILPACK"
buildCommand = "pnpm --filter @oficiosya/shared build && pnpm --filter @oficiosya/backend run build"
watchPatterns = ["Backend/**", "packages/shared/**", "pnpm-lock.yaml", "package.json", "pnpm-workspace.yaml"]

[deploy]
preDeployCommand = ["pnpm --filter @oficiosya/backend exec prisma migrate deploy"]
startCommand = "pnpm --filter @oficiosya/backend start"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
