# Alternativa Render (el stack elegido es Railway). Root Directory = Backend.

services:
  - type: web
    name: oficiosya-api
    runtime: node
    plan: starter
    region: oregon
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm run build
    preDeployCommand: pnpm exec prisma migrate deploy
    startCommand: pnpm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_DOMAIN
        value: ''
      - key: SUPABASE_PUBLIC_BUCKET
        value: public-media
      - key: SUPABASE_PRIVATE_BUCKET
        value: chat-media
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
